<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScanMark</title>
    <link rel="icon" href="./assets/scanner.ico"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="nav-bar">
      <div
        class="nav-brand"
        onclick="window.location.href = '/teacher-dashboard'"
      >
        <span class="nav-logo">⛶</span> ScanMark
      </div>
      <div class="nav-links">
        <a class="nav-link" href="/teacher-dashboard"
          ><span class="nav-icon"><i class='bx bx-broadcast'></i></span> Session</a
        >
        <a class="nav-link" href="/teacher-analytics"
          ><span class="nav-icon"><i class='bx bx-bar-chart-alt-2'></i></span> Analytics</a
        >
        <a class="nav-link" href="/teacher-manage-students-attendence"
          ><span class="nav-icon"><i class='bx bx-group'></i></span> Manage Students Attendance</a
        >
        <a class="nav-link active" href="/teacher-profile"
          ><span class="nav-icon"><i class='bx bx-user'></i></span> Profile</a
        >
        <a class="nav-link nav-logout" id="logoutBtn"
          ><span class="nav-icon"><i class='bx bx-power-off'></i></span> Logout</a
        >
      </div>
      <button class="nav-hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <i class='bx bx-menu'></i>
      </button>
    </nav>

    <!-- Main Content -->
    <div class="dashboard">
      <div class="page-header">
        <h1><i class='bx bx-user'></i> My Profile</h1>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="changePasswordBtn">
            <i class='bx bx-lock-alt'></i> Change Password
          </button>
          <button class="btn btn-outline btn-sm" id="editProfileBtn">
            <i class='bx bx-edit'></i> Edit
          </button>
        </div>
      </div>

      <div class="content-card" id="profileContent">
        <div class="profile-loading">Loading profile...</div>
      </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="passwordModal">
      <div class="modal-card">
        <h2><i class='bx bx-lock-alt'></i> Change Password</h2>
        <form id="changePasswordForm" class="auth-form" style="gap:1rem;">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="password-input">
              <input
                type="password"
                id="new-password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" data-target="new-password" aria-label="Show password" aria-pressed="false">
                <i class='bx bx-show'></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <div class="password-input">
              <input
                type="password"
                id="confirm-password"
                placeholder="Re-enter new password"
                minlength="6"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" data-target="confirm-password" aria-label="Show password" aria-pressed="false">
                <i class='bx bx-show'></i>
              </button>
            </div>
          </div>
          <div id="passwordError" class="form-error" style="display:none;"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-outline" id="cancelPasswordBtn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="savePasswordBtn">Change Password</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
      function setupPasswordToggles() {
        document.querySelectorAll(".password-toggle").forEach((toggle) => {
          toggle.addEventListener("click", () => {
            const input = document.getElementById(toggle.dataset.target);
            const icon = toggle.querySelector("i");
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";
            toggle.setAttribute("aria-pressed", String(isHidden));
            toggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            icon.className = isHidden ? "bx bx-hide" : "bx bx-show";
          });
        });
      }

      setupPasswordToggles();

      // ─── Auth Guard ───
      if (
        !ApiService.isAuthenticated() ||
        ApiService.getUser()?.role !== "teacher"
      ) {
        window.location.href = "/teacher-login";
      }

      // ─── Logout ───
      document.getElementById("logoutBtn").addEventListener("click", function () {
        ApiService.clearAuth();
        window.location.href = "/";
      });

      // ─── Mobile Nav ───
      document.getElementById("hamburgerBtn").addEventListener("click", function () {
        document.querySelector(".nav-links").classList.toggle("nav-open");
      });

      // ─── Toast Helper ───
      function showToast(message, type) {
        var existing = document.querySelector(".toast");
        if (existing) existing.remove();
        var toast = document.createElement("div");
        toast.className = "toast toast-" + type;
        toast.innerHTML =
          '<div class="toast-content"><span class="toast-icon">' +
          (type === "success" ? "&#10003;" : "&#10007;") +
          '</span><span class="toast-message">' +
          message +
          "</span></div>";
        document.body.appendChild(toast);
        requestAnimationFrame(function () { toast.classList.add("show"); });
        setTimeout(function () {
          toast.classList.remove("show");
          setTimeout(function () { toast.remove(); }, 300);
        }, 4000);
      }

      // ─── Profile State ───
      var isEditing = false;
      var profileData = null;

      var editBtn = document.getElementById("editProfileBtn");
      var content = document.getElementById("profileContent");

      // ─── Load Profile ───
      async function loadProfile() {
        try {
          var result = await ApiService.getTeacherProfile();
          profileData = result.profile;
          renderProfileView();
        } catch (error) {
          content.innerHTML =
            '<div class="empty-state"><p class="error-text">' +
            error.message +
            "</p></div>";
        }
      }

      // ─── Render View Mode ───
      function renderProfileView() {
        var p = profileData;
        var avatar = p.name ? p.name.charAt(0).toUpperCase() : "T";

        var subjectBadges = "";
        if (p.subjectCodes && p.subjectCodes.length) {
          p.subjectCodes.forEach(function (code) {
            subjectBadges += '<span class="badge badge-green">' + code + "</span> ";
          });
        } else {
          subjectBadges = '<span style="color:var(--text-muted)">None</span>';
        }

        content.innerHTML =
          '<div class="profile-view fade-in">' +
            '<div class="profile-header-card">' +
              '<div class="profile-avatar-lg">' + avatar + "</div>" +
              '<span class="profile-name">' + p.name + "</span>" +
              '<span class="profile-roll"><span class="badge badge-purple">' + (p.professorType === "Professor" ? "Professor" : p.professorType + " Professor") + "</span></span>" +
            "</div>" +
            '<div class="profile-fields">' +
              '<div class="profile-section-label"><i class="bx bx-envelope"></i> Account</div>' +
              '<div class="profile-field">' +
                '<span class="field-label">Institute Email</span>' +
                '<span class="field-value">' + p.email + "</span>" +
              "</div>" +
              '<div class="profile-section-label"><i class="bx bx-book-reader"></i> Academic Info</div>' +
              '<div class="profile-field">' +
                '<span class="field-label">Department</span>' +
                '<span class="field-value">' + p.department + "</span>" +
              "</div>" +
              '<div class="profile-field">' +
                '<span class="field-label">Professor Type</span>' +
                '<span class="field-value"><span class="badge badge-purple">' + (p.professorType === "Professor" ? "Professor" : p.professorType + " Professor") + "</span></span>" +
              "</div>" +
              '<div class="profile-field">' +
                '<span class="field-label">Subject Teaching</span>' +
                '<span class="field-value" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;">' + subjectBadges + "</span>" +
              "</div>" +
            "</div>" +
          "</div>";
      }

      // ─── Render Edit Mode ───
      function renderProfileEdit() {
        var p = profileData;

        var subjectBadges = "";
        var codes = p.subjectCodes || [];
        codes.forEach(function (code) {
          subjectBadges += '<span class="badge badge-green">' + code + "</span> ";
        });

        content.innerHTML =
          '<form id="editForm" class="profile-edit fade-in">' +
          '<div class="form-group disabled-field">' +
          '<label><i class="bx bx-user"></i> Name <span class="immutable-badge">Cannot be changed</span></label>' +
          '<input type="text" value="' + (p.name || "") + '" disabled>' +
          "</div>" +
          '<div class="form-group">' +
          '<label><i class="bx bx-briefcase"></i> Professor Type</label>' +
          '<select id="tedit-type" required>' +
          '<option value="Assistant"' +
          (p.professorType === "Assistant" ? " selected" : "") +
          ">Assistant Professor</option>" +
          '<option value="Associate"' +
          (p.professorType === "Associate" ? " selected" : "") +
          ">Associate Professor</option>" +
          '<option value="Professor"' +
          (p.professorType === "Professor" ? " selected" : "") +
          ">Professor</option>" +
          "</select>" +
          "</div>" +
          '<div class="form-group disabled-field">' +
          '<label><i class="bx bx-envelope"></i> Institute Email <span class="immutable-badge">Cannot be changed</span></label>' +
          '<input type="text" value="' + (p.email || "") + '" disabled>' +
          "</div>" +
          '<div class="form-group disabled-field">' +
          '<label><i class="bx bx-building-house"></i> Department <span class="immutable-badge">Cannot be changed</span></label>' +
          '<input type="text" value="' + (p.department || "") + '" disabled>' +
          "</div>" +
          '<div class="form-group disabled-field">' +
          '<label><i class="bx bx-book"></i> Subject Codes <span class="immutable-badge">Cannot be changed</span></label>' +
          '<div class="disabled-badges">' + subjectBadges + "</div>" +
          "</div>" +
          '<button type="submit" class="btn btn-primary btn-lg" id="saveBtn"><i class="bx bx-save"></i> Save Changes</button>' +
          "</form>";

        document
          .getElementById("editForm")
          .addEventListener("submit", handleSave);
      }

      // ─── Save Profile ───
      async function handleSave(e) {
        e.preventDefault();
        var saveBtn = document.getElementById("saveBtn");
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span>';

        try {
          var data = {
            professorType: document.getElementById("tedit-type").value,
          };

          var result = await ApiService.updateTeacherProfile(data);
          profileData = result.profile;

          var currentUser = ApiService.getUser();
          ApiService.setAuth(ApiService.getToken(), {
            ...currentUser,
            ...data,
          });

          isEditing = false;
          editBtn.innerHTML = '<i class="bx bx-edit"></i> Edit';
          renderProfileView();
          showToast("Profile updated successfully!", "success");
        } catch (error) {
          showToast(error.message, "error");
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i class="bx bx-save"></i> Save Changes';
        }
      }

      // ─── Toggle Edit ───
      editBtn.addEventListener("click", function () {
        isEditing = !isEditing;
        if (isEditing) {
          editBtn.innerHTML = '<i class="bx bx-x"></i> Cancel';
          renderProfileEdit();
        } else {
          editBtn.innerHTML = '<i class="bx bx-edit"></i> Edit';
          renderProfileView();
        }
      });

      // ─── Change Password Modal ───
      var modal = document.getElementById("passwordModal");
      var form = document.getElementById("changePasswordForm");
      var errEl = document.getElementById("passwordError");

      function openModal() {
        form.reset();
        errEl.style.display = "none";
        modal.style.display = "flex";
        requestAnimationFrame(function () { modal.classList.add("show"); });
      }

      function closeModal() {
        modal.classList.remove("show");
        setTimeout(function () { modal.style.display = "none"; }, 250);
      }

      document.getElementById("changePasswordBtn").addEventListener("click", openModal);
      document.getElementById("cancelPasswordBtn").addEventListener("click", closeModal);

      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeModal();
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        errEl.style.display = "none";

        var newPw = document.getElementById("new-password").value;
        var confirmPw = document.getElementById("confirm-password").value;

        if (newPw !== confirmPw) {
          errEl.textContent = "Passwords do not match.";
          errEl.style.display = "block";
          return;
        }

        var btn = document.getElementById("savePasswordBtn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';

        try {
          await ApiService.changeTeacherPassword({ newPassword: newPw });
          closeModal();
          showToast("Password changed successfully!", "success");
        } catch (error) {
          errEl.textContent = error.message;
          errEl.style.display = "block";
        } finally {
          btn.disabled = false;
          btn.textContent = "Change Password";
        }
      });

      // ─── Init ───
      loadProfile();
    </script>
  </body>
</html>
